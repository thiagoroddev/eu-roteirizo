<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="alternate icon" type="image/png" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <meta name="theme-color" content="#0A0C10" />

    <meta
      name="description"
      content="Transforma o romaneio de entregas em rota a pé, sobre o grafo de ruas do OpenStreetMap. Roda no aparelho, sem conta e sem servidor."
    />

    <!-- Card de preview quando o link é compartilhado. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eu Roteirizo" />
    <meta property="og:title" content="Eu Roteirizo" />
    <meta
      property="og:description"
      content="Romaneio de entregas vira rota a pé, sobre o grafo de ruas do OpenStreetMap. Sem backend, sem conta, sem API de roteirização paga."
    />
    <meta property="og:url" content="https://eu-roteirizo-prototipo.pages.dev/" />
    <meta property="og:image" content="https://eu-roteirizo-prototipo.pages.dev/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
    <script>
      /* Aplica o tema antes do render (evita flash). Default = dark (Neon Flux,
         TASK-REF-012). Manter em sincronia com themeService.getStoredMode. */
      (function () {
        try {
          var m = localStorage.getItem("theme") || "dark";
          var dark = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Eu Roteirizo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
