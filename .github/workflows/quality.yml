name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  pronto-para-merge:
    name: Tarefa concluida no ramo
    # Ramo wip/ pode subir com trabalho pausado; o que nao pode e entrar no main (.mentor/processos/entrega.md).
    # So no PR, e fora dos PRs do Dependabot, que nao tem tarefa.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25

      # O titulo e texto de quem abriu o PR: entra por variavel de ambiente, nunca interpolado no run.
      - name: Tarefa do titulo concluida
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: node mentor.mjs pronto-para-merge --titulo "$TITULO"
