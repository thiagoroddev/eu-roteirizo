<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protótipo interativo — Modo Original (clique nas paradas)</title>
<style>
  :root {
    --cyan: #0DC2D6; --ink: #0B1326; --bg: #f4f7fb; --card: #fff; --border: #e2e8f0; --muted: #64748b;
    --com-top: #3DA0FF; --com-bot: #1559C9; --com-glow: rgba(45,127,240,.55);
    --res-top: #34D27A; --res-bot: #0E8C49; --res-glow: rgba(34,184,102,.50);
    --ind-top: #B6BCC6; --ind-bot: #8A909C;
    --badge: #F5B400; --badge-ink: #5A4300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hanken Grotesk", system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
  .hint { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; }
  .hint b { color: var(--ink); }

  .map {
    position: relative; height: 440px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    background-image:
      linear-gradient(transparent 0, transparent 38px, #eaf0f6 38px, #eaf0f6 40px),
      linear-gradient(90deg, transparent 0, transparent 58px, #eaf0f6 58px, #eaf0f6 60px),
      linear-gradient(120deg, #fbfdff 0%, #eef3f9 100%);
    background-size: 40px 40px, 60px 60px, 100% 100%;
    cursor: default;
  }
  .pt { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #1e293b; opacity: .22; pointer-events: none; }
  .mk { position: absolute; transform: translate(-50%, -100%); cursor: pointer; transition: filter .12s; }
  .mk .body { transition: filter .12s; }
  .mk.s-com .body { filter: drop-shadow(0 0 6px var(--com-glow)) drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  .mk.s-res .body { filter: drop-shadow(0 0 6px var(--res-glow)) drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  .mk.s-ind .body { filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
  .mk.sel.s-com .body { filter: drop-shadow(0 0 11px var(--com-glow)) drop-shadow(0 0 4px var(--com-glow)); }
  .mk.sel.s-res .body { filter: drop-shadow(0 0 11px var(--res-glow)) drop-shadow(0 0 4px var(--res-glow)); }
  .mk.sel.s-ind .body { filter: drop-shadow(0 0 8px rgba(0,0,0,.35)); }

  .popup {
    position: absolute; z-index: 20; width: 240px; transform: translate(-50%, calc(-100% - 56px));
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 28px rgba(15,23,42,.18); padding: 12px 14px;
  }
  .popup::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; background: var(--card); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transform: translateX(-50%) rotate(45deg); }
  .popup h3 { margin: 0 0 2px; font-size: 14px; }
  .popup .sub { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .popup .type { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 10px; }
  .popup .type.com { background: #e3effe; color: #1559C9; }
  .popup .type.res { background: #e1f7ec; color: #0E8C49; }
  .popup .type.ind { background: #eef0f3; color: #5b626d; }
  .popup .pkgs-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .popup ul { list-style: none; margin: 0; padding: 0; }
  .popup li { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 4px 0; border-top: 1px solid #f1f5f9; }
  .popup li code { font-family: ui-monospace, monospace; color: var(--ink); }
  .popup li span { color: var(--muted); white-space: nowrap; }
  .popup .x { position: absolute; right: 8px; top: 6px; border: none; background: none; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Modo Original — interativo</h1>
  <p class="hint"><b>Clique numa parada</b> (quadrado) para expandir os endereços · <b>clique num endereço</b> (círculo) para ver os pacotes · <b>clique fora</b> para recolher.</p>
  <div class="map" id="map"></div>
</div>

<script>
  function createMarker({ shape = "circle", type = "com", number = 1, count = 1, countKind = "pacotes", selected = false, scale = .85 }) {
    const W = 92, H = 104, cx = 46, cyTop = 12, bodyH = 56, cyMid = cyTop + bodyH / 2, bodyBottom = cyTop + bodyH;
    const tip = `M${cx - 7},${bodyBottom - 6} L${cx},${bodyBottom + 30} L${cx + 7},${bodyBottom - 6} Z`;
    const grad = `g-${type}`;
    const numFill = type === "ind" ? "#2A2F38" : "#ffffff";
    const stroke = selected ? `stroke="#ffffff" stroke-width="4"` : `stroke="rgba(255,255,255,.4)" stroke-width="1.5"`;
    const body = shape === "square"
      ? `<rect x="${cx - 28}" y="${cyTop}" width="56" height="${bodyH}" rx="15" fill="url(#${grad})" ${stroke}/>`
      : `<circle cx="${cx}" cy="${cyMid}" r="28" fill="url(#${grad})" ${stroke}/>`;
    const glyph = countKind === "enderecos"
      ? `<g transform="translate(9,4)" fill="none" stroke="var(--badge-ink)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M5,1 C2.8,1 1,2.8 1,5 C1,8.5 5,12.5 5,12.5 C5,12.5 9,8.5 9,5 C9,2.8 7.2,1 5,1 Z"/><circle cx="5" cy="5" r="1.6"/></g>`
      : `<g transform="translate(6,5)" fill="none" stroke="var(--badge-ink)" stroke-width="1.4" stroke-linejoin="round"><path d="M0,3 L6,0 L12,3 L6,6 Z"/><path d="M0,3 L0,10 L6,13 L6,6"/><path d="M12,3 L12,10 L6,13"/></g>`;
    const badge = count > 1 ? `<g transform="translate(${cx + 8}, ${cyTop - 4})"><rect x="0" y="0" width="${count > 9 ? 40 : 34}" height="22" rx="11" fill="var(--badge)"/>${glyph}<text x="${count > 9 ? 28 : 25}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="var(--badge-ink)" font-family="Hanken Grotesk, sans-serif">${count}</text></g>` : "";
    const hasNum = number !== null && number !== undefined && number !== "";
    const numEl = hasNum ? `<text x="${cx}" y="${cyMid + 9}" text-anchor="middle" font-size="${number > 99 ? 19 : 24}" font-weight="800" fill="${numFill}" font-family="Hanken Grotesk, sans-serif">${number}</text>` : "";
    return `<svg class="marker" width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g-com" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--com-top)"/><stop offset="1" stop-color="var(--com-bot)"/></linearGradient>
        <linearGradient id="g-res" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--res-top)"/><stop offset="1" stop-color="var(--res-bot)"/></linearGradient>
        <linearGradient id="g-ind" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ind-top)"/><stop offset="1" stop-color="var(--ind-bot)"/></linearGradient>
      </defs>
      <g class="body"><path d="${tip}" fill="url(#${grad})"/>${body}${numEl}</g>${badge}
    </svg>`;
  }

  const TYPE_TXT = { com: "Comercial", res: "Residencial", ind: "Indefinido" };

  const paradas = [
    { stop: 7, addresses: [
      { seq: 7,  type: "com", x: 150, y: 175, full: "Av. Atlântica, 1500", comp: "Loja 3",  pkgs: [{ tn: "BR1001SPX", seq: 7 }] },
      { seq: 9,  type: "res", x: 212, y: 130, full: "Av. Atlântica, 1520", comp: "Apt 802", pkgs: [{ tn: "BR1002SPX", seq: 9 }, { tn: "BR1003SPX", seq: 12 }] },
      { seq: 12, type: "com", x: 116, y: 235, full: "Av. Atlântica, 1540", comp: "Sala 210", pkgs: [{ tn: "BR1004SPX", seq: 14 }] },
    ]},
    { stop: 11, addresses: [
      { seq: 11, type: "res", x: 470, y: 205, full: "Rua Santa Clara, 50", comp: "Apt 101", pkgs: [{ tn: "BR3001SPX", seq: 11 }] },
      { seq: 14, type: "res", x: 540, y: 150, full: "Rua Santa Clara, 70", comp: "Apt 305", pkgs: [{ tn: "BR3002SPX", seq: 15 }, { tn: "BR3003SPX", seq: 16 }] },
    ]},
    { stop: 8, addresses: [
      { seq: 8, type: "res", x: 300, y: 320, full: "Rua Barata Ribeiro, 200", comp: "Casa", pkgs: [{ tn: "BR2001SPX", seq: 8 }] },
    ]},
    { stop: 10, addresses: [
      { seq: 10, type: "ind", x: 560, y: 330, full: "Rua Tonelero, 300", comp: "—", pkgs: [{ tn: "BR4001SPX", seq: 10 }] },
    ]},
  ];

  const paradaType = (p) => p.addresses.some(a => a.type === "com") ? "com" : p.addresses.some(a => a.type === "res") ? "res" : "ind";
  const representative = (p) => p.addresses.reduce((m, a) => a.seq < m.seq ? a : m, p.addresses[0]);
  const isMulti = (p) => p.addresses.length > 1;

  let expandedStop = null;
  let selected = null; // { stop, seq } | null

  const map = document.getElementById("map");

  function markerEl(html, x, y, cls, onClick) {
    const d = document.createElement("div");
    d.className = "mk " + cls;
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.innerHTML = html;
    d.addEventListener("click", (e) => { e.stopPropagation(); onClick(); });
    return d;
  }

  function render() {
    map.querySelectorAll(".mk, .pt, .popup").forEach(n => n.remove());

    paradas.forEach(p => {
      if (expandedStop === p.stop) {
        const rep0 = representative(p);
        p.addresses.forEach(a => {
          map.appendChild(Object.assign(document.createElement("div"), { className: "pt" , style: `left:${a.x}px;top:${a.y}px` }));
          const sel = selected && selected.stop === p.stop && selected.seq === a.seq;
          const number = a.seq === rep0.seq ? p.stop : null;
          const html = createMarker({ shape: "circle", type: a.type, number, count: a.pkgs.length, countKind: "pacotes", selected: sel });
          map.appendChild(markerEl(html, a.x, a.y, "s-" + a.type + (sel ? " sel" : ""), () => selectAddress(p, a)));
        });
      } else {
        const rep = representative(p);
        const t = paradaType(p);
        const multi = isMulti(p);
        const sel = selected && selected.stop === p.stop;
        map.appendChild(Object.assign(document.createElement("div"), { className: "pt", style: `left:${rep.x}px;top:${rep.y}px` }));
        const html = multi
          ? createMarker({ shape: "square", type: t, number: p.stop, count: p.addresses.length, countKind: "enderecos", selected: sel })
          : createMarker({ shape: "circle", type: t, number: p.stop, count: rep.pkgs.length, countKind: "pacotes", selected: sel });
        map.appendChild(markerEl(html, rep.x, rep.y, "s-" + t + (sel ? " sel" : ""), () => clickParada(p)));
      }
    });

    if (selected && expandedStop) {
      const p = paradas.find(x => x.stop === expandedStop);
      const a = p && p.addresses.find(x => x.seq === selected.seq);
      if (a) renderPopup(a);
    }
  }

  function clickParada(p) {
    if (isMulti(p)) { expandedStop = p.stop; selected = null; }
    else { selected = { stop: p.stop, seq: representative(p).seq }; expandedStop = null; }
    render();
  }

  function selectAddress(p, a) { selected = { stop: p.stop, seq: a.seq }; render(); }

  function renderPopup(a) {
    const div = document.createElement("div");
    div.className = "popup";
    div.style.left = a.x + "px";
    div.style.top = a.y + "px";
    div.addEventListener("click", e => e.stopPropagation());
    const pkgs = a.pkgs.map(k => `<li><code>${k.tn}</code><span>seq ${k.seq}</span></li>`).join("");
    div.innerHTML = `
      <button class="x" aria-label="Fechar">&times;</button>
      <h3>${a.full}</h3>
      <p class="sub">Complemento: ${a.comp}</p>
      <span class="type ${a.type}">${TYPE_TXT[a.type]}</span>
      <p class="pkgs-h">Pacotes (${a.pkgs.length})</p>
      <ul>${pkgs}</ul>`;
    div.querySelector(".x").addEventListener("click", (e) => { e.stopPropagation(); selected = null; render(); });
    map.appendChild(div);
  }

  map.addEventListener("click", () => { expandedStop = null; selected = null; render(); });

  render();
</script>
</body>
</html>
